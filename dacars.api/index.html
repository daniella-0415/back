<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>July Calendar 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>July Calendar</h1>

    <div class="calendar">

      <div class="day-name">Sun</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name">Sat</div>

      <div class="empty"></div>
      <div class="empty"></div>
      <div class="empty"></div>

      <div class="day" data-day="1">1</div>
      <div class="day" data-day="2">2</div>
      <div class="day" data-day="3">3</div>
      <div class="day" data-day="4">4</div>
      <div class="day" data-day="5">5</div>
      <div class="day" data-day="6">6</div>
      <div class="day" data-day="7">7</div>

      <div class="day" data-day="8">8</div>
      <div class="day" data-day="9">9</div>
      <div class="day" data-day="10">10</div>
      <div class="day" data-day="11">11</div>
      <div class="day" data-day="12">12</div>
      <div class="day" data-day="13">13</div>
      <div class="day" data-day="14">14</div>

      <div class="day" data-day="15">15</div>
      <div class="day" data-day="16">16</div>
      <div class="day" data-day="17">17</div>
      <div class="day" data-day="18">18</div>
      <div class="day" data-day="19">19</div>
      <div class="day" data-day="20">20</div>
      <div class="day" data-day="21">21</div>

      <div class="day" data-day="22">22</div>
      <div class="day" data-day="23">23</div>
      <div class="day" data-day="24">24</div>
      <div class="day" data-day="25">25</div>
      <div class="day" data-day="26">26</div>
      <div class="day" data-day="27">27</div>
      <div class="day" data-day="28">28</div>

      <div class="day" data-day="29">29</div>
      <div class="day" data-day="30">30</div>
      <div class="day" data-day="31">31</div>

    </div>

    <div class="form-container">

      <h2>Add Event</h2>

      <label>Person / Personality</label>
      <input type="text" id="person" placeholder="">

      <label>Event Title</label>
      <input type="text" id="title" placeholder="Birthday">

      <label>Notes</label>
      <textarea id="notes" placeholder=""></textarea>

      <label>Select Date (July)</label>
      <select id="dateSelect">
        <option value="1">1 July</option>
        <option value="2">2 July</option>
        <option value="3">3 July</option>
        <option value="4">4 July</option>
        <option value="5">5 July</option>
        <option value="6">6 July</option>
        <option value="7">7 July</option>
        <option value="8">8 July</option>
        <option value="9">9 July</option>
        <option value="10">10 July</option>
        <option value="11">11 July</option>
        <option value="12">12 July</option>
        <option value="13">13 July</option>
        <option value="14">14 July</option>
        <option value="15">15 July</option>
        <option value="16">16 July</option>
        <option value="17">17 July</option>
        <option value="18">18 July</option>
        <option value="19">19 July</option>
        <option value="20">20 July</option>
        <option value="21">21 July</option>
        <option value="22">22 July</option>
        <option value="23">23 July</option>
        <option value="24">24 July</option>
        <option value="25">25 July</option>
        <option value="26">26 July</option>
        <option value="27">27 July</option>
        <option value="28">28 July</option>
        <option value="29">29 July</option>
        <option value="30">30 July</option>
        <option value="31">31 July</option>
      </select>

      <button onclick="addEvent()">Add Event</button>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
